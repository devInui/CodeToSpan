<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="OptionsTitle"></title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <h1 data-i18n="OptionsTitle"></h1>
        <p data-i18n="OptionsLead"></p>
      </header>

      <form id="optionsForm">
        <div class="settings-grid">
          <div class="settings-columns">
            <section class="settings-section page-language">
              <h2 data-i18n="PageLanguageTitle"></h2>
              <p class="description" data-i18n="PageLanguageDescription"></p>
              <label class="checkbox-label">
                <input type="checkbox" id="isLanguageCheckEnabled" />
                <span data-i18n="EnableLanguageDetection"></span>
              </label>
            </section>

            <section class="settings-section code-rules">
              <h2 data-i18n="CodeElementRulesTitle"></h2>
              <p class="description" data-i18n-description="ExcludeTagsDescription"></p>
              <div class="options-container">
                <label class="checkbox-label">
                  <input type="checkbox" id="excludePre" name="excludePre" />
                  <span data-i18n="InPreTag"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="excludeDiv" name="excludeDiv" />
                  <span data-i18n="InDivTag"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="excludeA" name="excludeA" />
                  <span data-i18n="InATag"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="excludeSpan" name="excludeSpan" />
                  <span data-i18n="InSpanTag"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="skipStyledCodeTags" />
                  <span data-i18n="ProtectSizedCodeBlocks"></span>
                </label>
              </div>
              <p class="setting-note" data-i18n="ProtectSizedCodeDescription"></p>
            </section>

            <section class="settings-section translate-attributes">
              <h2 data-i18n="TranslateAttributesTitle"></h2>
              <p class="description" data-i18n-description="TranslateNoDescription"></p>
              <label class="checkbox-label">
                <input type="checkbox" id="addNoTranslateToPre" />
                <span data-i18n="AddTranslateNoToPre"></span>
              </label>
            </section>

            <section class="settings-section reset-section">
              <h2 data-i18n="SettingsManagementTitle"></h2>
              <label class="checkbox-label">
                <input type="checkbox" id="autoReloadOnRunStop" />
                <span data-i18n="AutoReloadOnRunStop"></span>
              </label>
              <p class="setting-note" data-i18n="AutoReloadOnRunStopDescription"></p>
              <div class="reset-row management-reset-row">
                <p class="description" data-i18n="ResetSettingsDescription"></p>
                <button
                  id="resetSettings"
                  type="button"
                  data-i18n="ResetButton"
                ></button>
              </div>
            </section>
          </div>

          <section class="settings-section domains-section">
            <h2 data-i18n="ExcludeDomainsTitle"></h2>
            <div class="options-container">
              <div id="domainListContainer">
                <ul id="excludedDomainsList"></ul>
              </div>
              <div id="domainInputContainer">
                <input
                  type="text"
                  id="newDomain"
                  placeholder=""
                  data-i18n-placeholder="AddDomainPlaceholder"
                />
                <button id="addDomain" data-i18n="AddDomainButton"></button>
              </div>
            </div>
            <p
              class="description"
              data-i18n-description="ExcludeDomainsDescription"
            ></p>
          </section>

          <div class="warning-message" data-i18n="ReloadWarning"></div>
        </div>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
