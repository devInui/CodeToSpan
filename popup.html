<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Toggle Switch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <!-- ヘッダー -->
      <h1>CodeToSpan<br />for Translation</h1>
      <!-- トグルスイッチ -->
      <div class="toggle-row">
        <span id="stop" class="toggle-label">STOP</span>
        <div class="toggle">
          <input type="checkbox" id="toggle" />
          <label for="toggle" class="slider"></label>
        </div>
        <span id="run" class="toggle-label">RUN</span>
      </div>

      <!-- 設定が古い場合の警告メッセージ -->
      <div id="settings-warning">
        <p><b>! Outdated Settings Detected.</b></p>
        <p>Please reload this page.</p>
        <ul id="settings-diff"></ul>
        <button id="reload-page">Reload</button>
      </div>

      <section id="more-actions" class="more-actions">
        <!-- オプションページへのリンク -->
        <a href="#" id="openOptionsPage" class="popup-button">Options</a>
        <button id="check-domain" class="popup-button" type="button">
          Check Domain
        </button>
        <section id="domain-check" class="domain-check">
          <div id="current-domain" class="domain-value"></div>
          <button id="add-current-domain" class="domain-add-button" type="button">
            Add
          </button>
        </section>
      </section>
      <button id="show-more-toggle" class="show-more-toggle" type="button">
        <span
          id="show-more-icon"
          class="double-chevron down"
          aria-hidden="true"
        ></span>
        <span id="show-more-label">Show More</span>
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
